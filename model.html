<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ECHO Model · TAGRO</title><link rel="stylesheet" href="assets/css/site.css"></head><body><header class="top"><div class="topin"><div class="brand">TAGRO <b>× ECHO</b></div><nav class="nav"><a href="index.html">Models</a><a href="service.html">Service</a><a href="parts.html">Parts</a></nav></div></header><main class="wrap" id="app"><div class="panel">Loading model…</div></main><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=new URLSearchParams(location.search).get('model');fetch('data/models.json').then(r=>r.json()).then(ms=>{const m=ms.find(x=>x.model===id);if(!m){app.innerHTML='<div class="panel"><h1>Model not found</h1><a href="index.html">Back to models</a></div>';return}document.title=m.model+' · ECHO Equipment Library';app.innerHTML=`<div class="breadcrumb"><a href="index.html">ECHO Library</a> / ${esc(m.category)} / ${esc(m.model)}</div><section class="product"><div class="panel productimg"><div class="placeholder">${esc(m.model)}<br><small>supplied product image slot</small></div></div><div class="panel"><div class="kicker">${esc(m.category)}</div><h1>${esc(m.model)}</h1><p class="lead">${esc(m.config)}</p><div class="specgrid"><div class="spec"><small>MRP</small><b>${esc(m.mrp)}</b></div><div class="spec"><small>Dealer price</small><b>${esc(m.dealer)}</b></div><div class="spec"><small>GST</small><b>${esc(m.gst)}</b></div><div class="spec"><small>Market</small><b>India / Kerala</b></div></div><p class="note">${esc(m.notes)}</p></div></section><section class="section panel"><div class="kicker">Technical record</div><h2>Model details</h2><p>Exact India-model specifications, supplied images and configuration details are added only from the supplied India material or exact-model ECHO technical documentation.</p></section><section class="section"><h2>Documents & workshop links</h2><div class="links"><a class="linkbox" href="${m.manual}" target="_blank" rel="noopener"><b>Service / Manual source</b><span class="status">External reference ↗</span><div>ManualsLib / ECHO documentation</div></a><a class="linkbox" href="${m.parts}" target="_blank" rel="noopener"><b>Parts / IPL source</b><span class="status">External reference ↗</span><div>Exploded parts / article numbers</div></a><a class="linkbox" href="https://www.echo-india.com/" target="_blank" rel="noopener"><b>ECHO India</b><span class="status">Manufacturer reference ↗</span><div>Product/specification verification</div></a></div></section><section class="section panel"><div class="kicker">Service workflow</div><h2>Workshop checklist</h2><p>Confirm model suffix and serial number → identify correct service manual and IPL → diagnose → verify part number against serial applicability → record replaced part and service outcome.</p></section><div class="footer"><a href="index.html">← All ECHO models</a></div>`})</script></body></html>
