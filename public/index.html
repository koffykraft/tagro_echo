<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>TAGRO × ECHO Kerala</title><link rel="stylesheet" href="assets/css/site.css"><link rel="stylesheet" href="assets/css/desktop.css"><link rel="stylesheet" href="assets/css/mobile.css"></head><body><header class="top"><div class="topin"><a class="brandlock" href="index.html" aria-label="TAGRO ECHO home"><img class="tagro" src="assets/brand/tagro-logo-actual.webp" alt="TAGRO"><span class="brandx">×</span><img class="echo" src="assets/brand/echo-logo-dark.svg" alt="ECHO"></a><nav class="nav"><a class="active" href="index.html"><svg class="navicon" viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20H4Z"/><path d="M9 20v-6h6v6"/></svg><span>Equipment</span></a><a href="service.html"><svg class="navicon" viewBox="0 0 24 24"><path d="M4 5.5A3.5 3.5 0 0 1 7.5 2H20v17H7.5A3.5 3.5 0 0 0 4 22Z"/><path d="M4 5.5V22"/></svg><span>Support</span></a><a href="parts.html"><svg class="navicon" viewBox="0 0 24 24"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9Z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9"/></svg><span>Parts</span></a><a class="ai" href="assistant.html"><svg class="navicon" viewBox="0 0 24 24"><path d="m12 2 1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8Z"/><path d="m19 15 .9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9Z"/></svg><span>Ask AI</span></a></nav></div></header><main class="wrap home"><section class="entry"><div><div class="eyebrow">ECHO · Kerala</div><h1>What are you working on?</h1></div><button id="searchToggle" class="iconbtn searchtoggle" type="button" aria-label="Search by model"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><span>Know the model?</span></button></section><div id="searchPanel" class="searchpanel" hidden><input id="q" class="search" autocomplete="off" placeholder="Search model, e.g. CS-620SX"></div><section id="jobs" class="jobs" aria-label="Choose by work"></section><div class="modelbar"><div class="kicker" id="categoryLabel">All equipment</div><p id="count"></p></div><section id="grid" class="grid"></section><footer class="sitefooter"><div class="contacticons"><a class="contacticon" href="https://wa.me/918921773291" aria-label="WhatsApp TAGRO" title="WhatsApp"><svg viewBox="0 0 24 24"><path d="M20.5 11.7a8.5 8.5 0 0 1-12.6 7.4L3.5 20.5l1.4-4.2A8.5 8.5 0 1 1 20.5 11.7Z"></path><path d="M9 8.5c.3 2.8 2.1 4.7 5 5.4"></path></svg></a><a class="contacticon" href="mailto:info@tagro.in" aria-label="Email TAGRO" title="Email"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m4 7 8 6 8-6"></path></svg></a></div><div class="sitelinks"><a href="https://www.tagro.in/" target="_blank" rel="noopener">Visit TAGRO website</a><a href="https://www.echo-india.com/en_us/" target="_blank" rel="noopener">Visit ECHO India website</a></div></footer></main><script>const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));function family(c=''){c=c.toLowerCase();if(c.includes('chain'))return'Chainsaws';if(c.includes('brush')||c.includes('trimmer'))return'Brushcutters';if(c.includes('blower'))return'Blowers';if(c.includes('hedge'))return'Hedge trimmers';if(c.includes('sprayer'))return'Sprayers';if(c.includes('pump'))return'Water pumps';if(c.includes('pruner'))return'Power pruners';if(c.includes('cut-off'))return'Cut-off saws';return'Other equipment'}const jobsDef=[['All','All'],['Cut trees','Chainsaws'],['Clear grass','Brushcutters'],['Trim hedges','Hedge trimmers'],['Blow debris','Blowers'],['Prune high','Power pruners'],['Spray crops','Sprayers'],['Move water','Water pumps']];let models=[],specs={},images={},active='All';function facts(s){return(s?.specs||[]).slice(0,2).map(x=>`<span><small>${esc(x[0])}</small><b>${esc(x[1])}</b></span>`).join('')}function imageFor(m){const u=images[m.model];return u?`<img src="${esc(u)}" alt="ECHO ${esc(m.model)}" loading="lazy" referrerpolicy="no-referrer">`:`<div class="imageawait"><b>${esc(m.model)}</b></div>`}function render(){const term=(q?.value||'').trim().toLowerCase();const list=models.filter(m=>(active==='All'||family(m.category)===active)&&(!term||(m.model+' '+m.category+' '+(specs[m.model]?.tag||'')+' '+(specs[m.model]?.pitch||'')).toLowerCase().includes(term)));count.textContent=list.length+' models';categoryLabel.textContent=active==='All'?'All equipment':active;grid.innerHTML=list.map(m=>{const s=specs[m.model]||{};return`<a class="card" href="models/${m.model.toLowerCase()}.html"><div class="photo">${imageFor(m)}</div><div class="cardbody"><div class="cardtop"><span class="pill">${esc(family(m.category))}</span><span class="view">View</span></div><div class="model">${esc(m.model)}</div><div class="cat">${esc(s.pitch||m.category)}</div><div class="cardfacts">${facts(s)}</div><div class="cardbottom"><strong>MRP ${esc(m.mrp)}</strong></div></div></a>`}).join('')||'<div class="panel"><h2>No matching equipment</h2></div>'}Promise.all([fetch('data/models.json').then(r=>r.json()),fetch('data/specs.json').then(r=>r.json()),fetch('data/images.json').then(r=>r.json()).catch(()=>({}))]).then(([m,s,i])=>{models=m;specs=s;images=i;jobs.innerHTML=jobsDef.map((x,n)=>`<button class="job${n===0?' active':''}" data-family="${esc(x[1])}">${esc(x[0])}</button>`).join('');jobs.onclick=e=>{const b=e.target.closest('.job');if(!b)return;active=b.dataset.family;jobs.querySelectorAll('.job').forEach(x=>x.classList.toggle('active',x===b));render()};render()});searchToggle.onclick=()=>{searchPanel.hidden=!searchPanel.hidden;if(!searchPanel.hidden)setTimeout(()=>q.focus(),50)};q.addEventListener('input',render);</script></body></html>
