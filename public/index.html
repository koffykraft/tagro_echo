<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>TAGRO × ECHO Kerala</title><meta name="description" content="ECHO outdoor power equipment from TAGRO Kerala. Browse chainsaws, brushcutters, blowers, hedge trimmers, sprayers, pumps and more."><link rel="stylesheet" href="assets/css/site.css"><link rel="stylesheet" href="assets/css/desktop.css"><link rel="stylesheet" href="assets/css/mobile.css"></head><body data-page="equipment"><div data-shell="header"></div><main class="page"><section class="intro-strip"><div class="intro-copy"><p class="eyebrow">TAGRO × ECHO · Kerala</p><h1 class="page-title">Outdoor power equipment for farm, estate and professional work.</h1></div><div class="intro-actions"><a class="primary-action orange-action" href="assistant.html">Help me choose</a></div></section><section class="equipment-tools"><div class="search-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg><input id="q" class="search-input" autocomplete="off" aria-label="Search by model" placeholder="Know the model? Search"></div></section><div class="section-head"><h2 id="sectionTitle">ECHO equipment</h2><p id="count"></p></div><section id="grid" class="product-grid" aria-live="polite"></section><div data-shell="footer"></div></main><script src="assets/js/shell.js"></script><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const family=c=>{c=String(c).toLowerCase();if(c.includes('chain'))return'Chainsaws';if(c.includes('brush')||c.includes('trimmer'))return'Brushcutters';if(c.includes('hedge'))return'Hedge trimmers';if(c.includes('blower'))return'Blowers';return'Other'};const allowed=['All','Chainsaws','Brushcutters','Hedge trimmers','Blowers','Other'];const requested=new URLSearchParams(location.search).get('family');const active=requested&&allowed.includes(requested)?requested:'All';let models=[],specs={},images={};function factsFor(s){return(s?.specs||[]).slice(0,2).map(x=>`<span class="fact-chip"><b>${esc(x[0])}</b> ${esc(x[1])}</span>`).join('')}function render(){const term=q.value.trim().toLowerCase();const list=models.filter(m=>(active==='All'||family(m.category)===active)&&(!term||(m.model+' '+m.category+' '+(specs[m.model]?.tag||'')+' '+(specs[m.model]?.pitch||'')).toLowerCase().includes(term)));sectionTitle.textContent=active==='All'?'ECHO equipment':active==='Other'?'Other equipment':active;count.textContent=list.length+' models';grid.innerHTML=list.map(m=>{const s=specs[m.model]||{},img=images[m.model];return`<a class="product-card" href="models/${m.model.toLowerCase()}.html"><div class="product-media">${img?`<img src="${esc(img)}" alt="ECHO ${esc(m.model)}" loading="lazy" referrerpolicy="no-referrer">`:''}</div><div class="product-copy"><div class="product-kicker">${esc(s.tag||m.category)}</div><div class="product-name">${esc(m.model)}</div><div class="product-pitch">${esc(s.pitch||m.category)}</div><div class="fact-line">${factsFor(s)}</div><div class="price-line">MRP ${esc(m.mrp)} <small>incl. GST</small></div></div></a>`}).join('')||'<div class="empty-state">No matching equipment.</div>'}Promise.all([fetch('data/models.json').then(r=>r.json()),fetch('data/specs.json').then(r=>r.json()),fetch('data/images.json').then(r=>r.json())]).then(([m,s,i])=>{models=m;specs=s;images=i;render()});q.addEventListener('input',render);</script></body></html>
