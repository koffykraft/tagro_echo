<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>TAGRO × ECHO Kerala</title><link rel="stylesheet" href="assets/css/site.css"><link rel="stylesheet" href="assets/css/desktop.css"><link rel="stylesheet" href="assets/css/mobile.css"></head><body><header class="top"><div class="topin"><a class="brandlock" href="index.html" aria-label="TAGRO ECHO home"><img class="tagro" src="assets/brand/tagro-logo.png" alt="TAGRO"><span class="brandx">×</span><img class="echo" src="assets/brand/echo-logo-dark.svg" alt="ECHO"></a><nav class="nav"><a class="active" href="index.html"><span>Equipment</span></a><a href="service.html"><span>Support</span></a><a href="parts.html"><span>Parts</span></a><a class="ai" href="assistant.html"><span>Ask AI</span></a></nav></div></header><main class="wrap home"><section class="entry"><div><div class="eyebrow">ECHO · Kerala</div><h1>What do you need to do?</h1></div><button id="searchToggle" class="iconbtn searchtoggle" type="button" aria-label="Search by model"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><span>Know the model?</span></button></section><div id="searchPanel" class="searchpanel" hidden><input id="q" class="search" autocomplete="off" placeholder="Search a model, e.g. CS-620SX"></div><section id="jobs" class="jobs" aria-label="Choose equipment by job"></section><div class="modelbar"><div><div class="kicker" id="categoryLabel">All equipment</div><h2 id="sectionTitle">ECHO equipment</h2></div><p id="count"></p></div><section id="grid" class="grid"></section><footer class="sitefooter"><div class="contacticons"><a class="contacticon" href="https://wa.me/918921773291" aria-label="WhatsApp TAGRO" title="WhatsApp"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 11.7a8.5 8.5 0 0 1-12.6 7.4L3.5 20.5l1.4-4.2A8.5 8.5 0 1 1 20.5 11.7Z"></path><path d="M9 8.5c.3 2.8 2.1 4.7 5 5.4"></path></svg></a><a class="contacticon" href="mailto:info@tagro.in" aria-label="Email TAGRO" title="Email"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m4 7 8 6 8-6"></path></svg></a></div><div class="sitelinks"><a href="https://www.tagro.in/" target="_blank" rel="noopener">Visit TAGRO website</a><a href="https://www.echo-india.com/en_us/" target="_blank" rel="noopener">Visit ECHO India website</a></div></footer></main><script>const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const money=n=>'₹'+Math.round(n).toLocaleString('en-IN');function basePrice(mrp,gst){const nums=String(mrp).replace(/₹/g,'').split('–').map(x=>Number(x.replace(/,/g,'').trim())).filter(Number.isFinite);const rate=1+parseFloat(gst)/100;if(!nums.length||!Number.isFinite(rate))return '';return nums.map(n=>money(n/rate)).join('–')}function family(c=''){c=c.toLowerCase();if(c.includes('chain'))return'Chainsaws';if(c.includes('brush')||c.includes('trimmer'))return'Brushcutters';if(c.includes('blower'))return'Blowers';if(c.includes('hedge'))return'Hedge trimmers';if(c.includes('sprayer'))return'Sprayers';if(c.includes('pump'))return'Water pumps';if(c.includes('pruner'))return'Power pruners';if(c.includes('cut-off'))return'Cut-off saws';return'Other equipment'}const jobDefs=[['All','All','All'],['Cut trees','Chainsaws','Chainsaws'],['Clear grass','Brushcutters','Brushcutters'],['Trim hedges','Hedge trimmers','Hedge trimmers'],['Blow debris','Blowers','Blowers'],['Prune high','Power pruners','Power pruners'],['Spray crops','Sprayers','Sprayers'],['Move water','Water pumps','Water pumps']];const imageMap={'CS-2511TES':'https://www.echo-tools.co.uk/cdn/shop/files/2025-ECHO-Website-CS-2511TES-Image2.jpg?v=1761144434&width=1946','CS-620SX':'https://mower.ie/data/product/425/images/cs-620sx-jpg.jpg'};let models=[],specs={},active='All';function cardFacts(s){const a=(s?.specs||[]).slice(0,2);return a.length?`<div class="cardfacts">${a.map(x=>`<span><small>${esc(x[0])}</small><b>${esc(x[1])}</b></span>`).join('')}</div>`:''}function imageFor(m,s){const u=s.image||imageMap[m.model];if(u)return`<img src="${esc(u)}" alt="ECHO ${esc(m.model)}" loading="lazy">`;return`<div class="imageawait"><span>${esc(m.model)}</span></div>`}function render(){const term=(q?.value||'').trim().toLowerCase();const list=models.filter(m=>(active==='All'||family(m.category)===active)&&(!term||(m.model+' '+m.category+' '+(specs[m.model]?.tag||'')+' '+(specs[m.model]?.pitch||'')).toLowerCase().includes(term)));count.textContent=list.length+' models';categoryLabel.textContent=active==='All'?'All equipment':active;sectionTitle.textContent=active==='All'?'ECHO equipment':active;grid.innerHTML=list.map(m=>{const s=specs[m.model]||{};return`<a class="card" href="models/${m.model.toLowerCase()}.html"><div class="photo">${imageFor(m,s)}<span class="cardtag">${esc(s.tag||family(m.category))}</span></div><div class="cardbody"><div class="model">${esc(m.model)}</div><div class="cat">${esc(s.pitch||m.category)}</div>${cardFacts(s)}<div class="cardbottom"><div><div class="price">${esc(basePrice(m.mrp,m.gst))} + GST</div><div class="small">MRP ${esc(m.mrp)}</div></div><span class="view">View</span></div></div></a>`}).join('')||'<div class="panel"><h2>No matching equipment</h2></div>'}Promise.all([fetch('data/models.json').then(r=>r.json()),fetch('data/specs.json').then(r=>r.json())]).then(([m,s])=>{models=m;specs=s;jobs.innerHTML=jobDefs.map((x,i)=>`<button class="job${i===0?' active':''}" data-family="${esc(x[1])}"><span>${esc(x[0])}</span></button>`).join('');jobs.onclick=e=>{const b=e.target.closest('.job');if(!b)return;active=b.dataset.family;jobs.querySelectorAll('.job').forEach(x=>x.classList.toggle('active',x===b));render()};render()});searchToggle.onclick=()=>{searchPanel.hidden=!searchPanel.hidden;if(!searchPanel.hidden)setTimeout(()=>q.focus(),50)};q.addEventListener('input',render);</script></body></html>
