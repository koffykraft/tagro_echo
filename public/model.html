<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ECHO Model · TAGRO</title><link rel="stylesheet" href="assets/css/site.css"></head><body><header class="top"><div class="topin"><div class="brand">TAGRO <b>× ECHO</b></div><nav class="nav"><a href="index.html">Models</a><a href="service.html">Support</a><a href="parts.html">Parts</a><a href="assistant.html">Ask AI</a></nav></div></header><main class="wrap" id="app"><div class="panel">Loading model…</div></main><script>const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const money=n=>'₹'+Math.round(n).toLocaleString('en-IN');function basePrice(mrp,gst){const nums=String(mrp).replace(/₹/g,'').split('–').map(x=>Number(x.replace(/,/g,'').trim())).filter(Number.isFinite);const rate=1+parseFloat(gst)/100;if(!nums.length||!Number.isFinite(rate))return '';return nums.map(n=>money(n/rate)).join('–')}function useCopy(m){const c=String(m.category||'').toLowerCase();if(c.includes('chain'))return 'Built for cutting, limbing and timber work. Choosing the right saw depends on tree size, cutting frequency, bar requirement and the amount of daily use.';if(c.includes('brush')||c.includes('trimmer'))return 'Designed for grass, weed and brush clearing. The best configuration depends on vegetation density, working area, cutting attachment and daily workload.';if(c.includes('hedge'))return 'Designed for hedge and shrub maintenance, with the right choice depending on reach, blade length, plant density and frequency of use.';if(c.includes('blower'))return 'Designed for fast clearing of leaves and debris. Air volume, air speed, weight and working duration are the main selection factors.';if(c.includes('sprayer'))return 'Designed for crop and plantation spraying. Tank capacity, discharge, carrying comfort and application pattern should match the intended crop and area.';if(c.includes('pump'))return 'Designed for portable water transfer and field use. Pump selection should match required flow, lift and hose arrangement.';return 'Designed for professional outdoor power-equipment work. TAGRO can help match the model and configuration to the intended application.'}const id=new URLSearchParams(location.search).get('model');fetch('data/models.json').then(r=>r.json()).then(ms=>{const m=ms.find(x=>x.model===id);if(!m){app.innerHTML='<div class="panel"><h1>Model not found</h1><a href="index.html">Back to models</a></div>';return}document.title=m.model+' · ECHO Equipment Library';const tech=m.techdocs?`<a class="linkbox" href="${m.techdocs}" target="_blank" rel="noopener"><b>Official ECHO technical documents</b><span class="status">Operator manuals + parts catalogs ↗</span><div>ECHO technical-documentation library, including serial-range documents where available</div></a>`:'';app.innerHTML=`<div class="breadcrumb"><a href="index.html">ECHO Library</a> / ${esc(m.category)} / ${esc(m.model)}</div><section class="product"><div class="panel productimg"><div class="placeholder">${esc(m.model)}<br><small>product image</small></div></div><div class="panel"><div class="kicker">${esc(m.category)}</div><h1>${esc(m.model)}</h1><p class="lead">${esc(m.config)}</p><div class="specgrid"><div class="spec"><small>Price before GST</small><b>${esc(basePrice(m.mrp,m.gst))}</b></div><div class="spec"><small>GST</small><b>${esc(m.gst)}</b></div><div class="spec"><small>MRP incl. GST</small><b>${esc(m.mrp)}</b></div><div class="spec"><small>Market</small><b>India / Kerala</b></div></div><p class="note">${esc(m.notes)}</p></div></section><section class="section panel"><div class="kicker">At a glance</div><h2>Where this model fits</h2><p>${esc(useCopy(m))}</p><p>Ask TAGRO about suitable bar, chain, blade, cutting attachment or other accessories for your work, and about current availability in Kerala.</p></section><section class="section"><h2>Manuals, parts & product information</h2><div class="links">${tech}<a class="linkbox" href="${m.manual}" target="_blank" rel="noopener"><b>Operator / technical information</b><span class="status">Open reference ↗</span><div>Operating and maintenance information for this model or model family</div></a><a class="linkbox" href="${m.parts}" target="_blank" rel="noopener"><b>Parts catalog / diagrams</b><span class="status">Open reference ↗</span><div>Exploded parts and component references where available</div></a><a class="linkbox" href="https://www.echo-india.com/" target="_blank" rel="noopener"><b>ECHO India</b><span class="status">Manufacturer website ↗</span><div>Official product information for India</div></a></div></section><section class="section panel"><div class="kicker">Owner support</div><h2>Keeping your ECHO ready for work</h2><p>Correct fuel and oil, a clean air filter, a sharp cutting system and regular inspection make a major difference to starting, performance and service life. TAGRO can assist with routine maintenance, genuine parts identification, repairs and selecting the right consumables for the job.</p></section><div class="footer"><a href="index.html">← All ECHO models</a></div>`})</script></body></html>
