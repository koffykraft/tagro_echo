<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#111315"><title>ECHO Model · TAGRO</title><link rel="stylesheet" href="assets/css/site.css"><link rel="stylesheet" href="assets/css/desktop.css"><link rel="stylesheet" href="assets/css/mobile.css"></head><body><header class="top"><div class="topin"><a class="brandlock" href="index.html"><img class="tagro" src="assets/brand/tagro-logo.png" alt="TAGRO"><span class="brandx">×</span><img class="echo" src="assets/brand/echo-logo-dark.svg" alt="ECHO"></a><nav class="nav"><a href="index.html">Equipment</a><a href="service.html">Support</a><a href="parts.html">Parts</a><a class="ai" href="assistant.html">Ask AI</a></nav></div></header><main class="wrap" id="app"><div class="panel">Loading model…</div></main><script>const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));const money=n=>'₹'+Math.round(n).toLocaleString('en-IN');function basePrice(mrp,gst){const nums=String(mrp).replace(/₹/g,'').split('–').map(x=>Number(x.replace(/,/g,'').trim())).filter(Number.isFinite);const rate=1+parseFloat(gst)/100;if(!nums.length||!Number.isFinite(rate))return '';return nums.map(n=>money(n/rate)).join('–')}function facts(s){return(s.specs||[]).slice(0,6).map(x=>`<div class="fact"><span>${esc(x[0])}</span><b>${esc(x[1])}</b></div>`).join('')}function features(s){return(s.features||[]).map(x=>`<span class="feature">${esc(x)}</span>`).join('')}const id=new URLSearchParams(location.search).get('model');Promise.all([fetch('data/models.json').then(r=>r.json()),fetch('data/specs.json').then(r=>r.json())]).then(([ms,ss])=>{const m=ms.find(x=>x.model===id),s=ss[id]||{};if(!m){app.innerHTML='<div class="panel"><h1>Model not found</h1><a href="index.html">Back to equipment</a></div>';return}document.title=m.model+' · TAGRO × ECHO';const tech=m.techdocs?`<a class="linkbox" href="${m.techdocs}" target="_blank" rel="noopener"><div><b>Official ECHO documents</b><div>Operator manuals and parts catalogs where available</div></div><span class="status">Open ↗</span></a>`:'';app.innerHTML=`<div class="breadcrumb"><a href="index.html">Equipment</a> / ${esc(m.model)}</div><section class="producthero"><div class="productvisual"><div class="visualcopy"><div class="visualcat">${esc(s.tag||m.category)}</div><div class="visualmodel">${esc(m.model)}</div></div></div><div class="productinfo"><span class="pill">${esc(m.category)}</span><h1>${esc(m.model)}</h1><p class="tagline">${esc(s.pitch||m.category)}</p><div class="facts">${facts(s)}</div><div class="featurestrip">${features(s)}</div><div class="buyrow"><div class="mrp"><small>Price before GST</small><strong>${esc(basePrice(m.mrp,m.gst))} + GST</strong><small>MRP incl. GST ${esc(m.mrp)}</small></div><a class="btn orange" href="assistant.html">Ask if it fits my work</a></div></div></section><div class="quickactions mobile-only"><a href="index.html">← Back</a><a href="#docs">Manuals</a><a href="assistant.html">Ask AI</a></div><section class="contentgrid" id="docs"><div class="panel"><div class="kicker">At a glance</div><h2>Why look at this model?</h2><p>${esc(s.pitch||'A practical ECHO option for the right application.')}</p><p class="desktop-only">The key figures above are the fast comparison points. For final selection, match the machine to the job, frequency of use and the cutting attachment or accessory required.</p></div><div class="panel"><div class="kicker">Resources</div><h2>Manuals & parts</h2><div class="links">${tech}<a class="linkbox" href="${esc(m.manual)}" target="_blank" rel="noopener"><div><b>Operator / technical information</b><div>Operating and maintenance reference</div></div><span class="status">Open ↗</span></a><a class="linkbox" href="${esc(m.parts)}" target="_blank" rel="noopener"><div><b>Parts information</b><div>Parts diagrams and references where available</div></div><span class="status">Open ↗</span></a></div></div></section><div class="footer"><a href="index.html">← Back to equipment</a></div>`})</script></body></html>
