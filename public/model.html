.innerHTML='<div class="panel"><h1>Model not found</h1><a href="index.html">Back</a></div>';return}document.title=m.model+' · TAGRO × ECHO';const img=s.image||imageMap[m.model];const visual=img?`<img src="${esc(img)}" alt="ECHO ${esc(m.model)}">`:`<div class="imageawait"></div>`;const tech=m.techdocs?`<a class="linkbox" href="${m.techdocs}" target="_blank" rel="noopener"><div><b>Official ECHO documents</b><div>Manuals and parts catalogs</div></div><span class="status">Open</span></a>`:'';app.innerHTML=`<div class="breadcrumb"><a href="index.html">Equipment</a> / ${esc(m.model)}</div><section class="producthero"><div class="productvisual">${visual}</div><div class="productinfo"><span class="pill">${esc(s.tag||m.category)}</span><h1>${esc(m.model)}</h1><p class="tagline">${esc(s.pitch||m.category)}</p><div class="facts">${facts(s)}</div><div class="featurestrip">${features(s)}</div><div class="buyrow"><div class="mrp"><small>Price before GST</small><strong>${esc(basePrice(m.mrp,m.gst))} + GST</strong><small>MRP incl. GST ${esc(m.mrp)}</small></div><a class="btn orange" href="assistant.html">Ask AI</a></div></div></section><div class="quickactions mobile-only"><a href="index.html">← Back</a><a href="#docs">Manuals</a><a href="assistant.html">Ask AI</a></div><section class="contentgrid" id="docs"><div class="panel"><div class="kicker">Features</div><h2>${esc(s.tag||m.category)}</h2><div class="featurestrip">${features(s)}</div></div><div class="panel"><div class="kicker">Resources</div><div class="links">${tech}<a class="linkbox" href="${esc(m.manual)}" target="_blank" rel="noopener"><div><b>Operator manual</b></div><span class="status">Open</span></a><a class="linkbox" href="${esc(m.parts)}" target="_blank" rel="noopener"><div><b>Parts information</b></div><span class="status">Open</span></a></div></div></section><footer class="sitefooter"><div class="contacticons"><a class="contacticon" href="https://wa.me/918921773291" aria-label="WhatsApp TAGRO" title="WhatsApp"><svg viewBox="0 0 24 24"><path d="M20.5 11.7a8.5 8.5 0 0 1-12.6 7.4L3.5 20.5l1.4-4.2A8.5 8.5 0 1 1 20.5 11.7Z"></path><path d="M9 8.5c.3 2.8 2.1 4.7 5 5.4"></path></svg></a><a class="contacticon" href="mailto:info@tagro.in" aria-label="Email TAGRO" title="Email"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m4 7 8 6 8-6"></path></svg></a></div><div class="sitelinks"><a href="https://www.tagro.in/" target="_blank" rel="noopener">Visit TAGRO website</a><a href="https://www.echo-india.com/en_us/" target="_blank" rel="noopener">Visit ECHO India website</a></div></footer>`})</script></body></html>
