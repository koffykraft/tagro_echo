<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>ECHO model · TAGRO</title><meta name="description" content="ECHO model information, specifications, price, manuals and parts support from TAGRO Kerala."><link rel="stylesheet" href="assets/css/site.css"><link rel="stylesheet" href="assets/css/desktop.css"><link rel="stylesheet" href="assets/css/mobile.css"></head><body data-page="equipment"><div data-shell="header"></div><main class="page model-page" id="app"><div class="empty-state">Loading model…</div></main><script src="assets/js/shell.js"></script><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const id=new URLSearchParams(location.search).get('model');const exact=u=>u&&!/manualslib\.com\/brand\/echo\/?$|benzo-spb\.ru\/?$/i.test(u);const sourceName=u=>{try{const h=new URL(u).hostname.replace(/^www\./,'');if(h.includes('echo-usa.com'))return'ECHO USA';if(h.includes('echo-india.com'))return'ECHO India';if(h.includes('echo-tools.co.uk'))return'ECHO UK';if(h.includes('manualslib.com'))return'ManualsLib';if(h.includes('benzo-spb.ru'))return'Benzo-SPB';return h}catch{return'External website'}};function facts(s){return(s.specs||[]).slice(0,6).map(x=>`<div class="model-fact"><span>${esc(x[0])}</span><strong>${esc(x[1])}</strong></div>`).join('')}function resourceLinks(m){const out=[];if(exact(m.techdocs))out.push(['Official ECHO documents',m.techdocs,'Manuals and parts catalogues']);if(exact(m.manual)&&m.manual!==m.techdocs)out.push(['Operator manual / technical information',m.manual,'Operating and maintenance reference']);if(exact(m.parts)&&m.parts!==m.techdocs&&m.parts!==m.manual)out.push(['Parts catalogue / diagrams',m.parts,'Parts diagrams and references']);return out.map(x=>`<a class="resource-link" href="${TAGRO_UI.gate(x[1],x[0],sourceName(x[1]),id)}"><div><b>${esc(x[0])}</b><span>${esc(x[2])}</span></div><strong>Choose</strong></a>`).join('')}Promise.all([fetch('data/models.json').then(r=>r.json()),fetch('data/specs.json').then(r=>r.json()),fetch('data/images.json').then(r=>r.json())]).then(([models,specs,images])=>{const m=models.find(x=>x.model===id),s=specs[id]||{};if(!m){app.innerHTML='<div class="empty-state"><a class="text-link" href="index.html">Back to equipment</a><h1>Model not found</h1></div>';return}document.title=m.model+' · TAGRO × ECHO';const img=images[id]||'',res=resourceLinks(m);app.innerHTML=`<a class="text-link" href="index.html">← Equipment</a><section class="model-layout"><div class="model-image">${img?`<img src="${esc(img)}" alt="ECHO ${esc(id)}" referrerpolicy="no-referrer">`:''}</div><div class="model-summary"><p class="eyebrow">${esc(s.tag||m.category)}</p><h1>${esc(id)}</h1><div class="model-class">${esc(m.category)}</div><p class="model-pitch">${esc(s.pitch||'')}</p><div class="model-facts">${facts(s)}</div><div class="model-price">MRP ${esc(m.mrp)} <small>incl. GST</small></div><div class="action-row"><a class="primary-action orange-action" href="assistant.html?model=${encodeURIComponent(id)}">Ask if this fits my work</a><a class="secondary-action" href="assistant.html?compare=${encodeURIComponent(id)}">Compare</a><a class="secondary-action" href="#resources">Manuals & parts</a></div></div></section><div class="content-columns"><section class="content-section"><h2>What stands out</h2><div class="feature-list">${(s.features||[]).slice(0,5).map(f=>`<span>${esc(f)}</span>`).join('')||'<span>Ask TAGRO for application guidance</span>'}</div></section><section class="content-section" id="resources"><h2>Manuals & parts</h2><div class="resource-list">${res||`<a class="resource-link" href="assistant.html?model=${encodeURIComponent(id)}"><div><b>Need a manual or part?</b><span>Ask TAGRO ECHO AI</span></div><strong>Ask</strong></a>`}</div></section></div><footer class="site-footer"><div class="footer-inner"><div class="contact-actions"><a class="icon-action" href="https://wa.me/918921773291" aria-label="WhatsApp TAGRO" title="WhatsApp">${TAGRO_UI.icons.whatsapp}</a><a class="icon-action" href="mailto:info@tagro.in" aria-label="Email TAGRO" title="Email">${TAGRO_UI.icons.mail}</a></div><div class="external-links"><a href="${TAGRO_UI.gate('https://www.tagro.in/','TAGRO website','TAGRO')}">Visit TAGRO website</a><a href="${TAGRO_UI.gate('https://www.echo-india.com/en_us/','ECHO India website','ECHO India')}">Visit ECHO India website</a></div></div></footer>`});</script></body></html>
