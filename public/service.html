<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>ECHO Support · TAGRO Kerala</title><meta name="description" content="Find ECHO manuals, maintenance help and owner support by machine model."><link rel="stylesheet" href="assets/css/site.css"><link rel="stylesheet" href="assets/css/desktop.css"><link rel="stylesheet" href="assets/css/mobile.css"></head><body data-page="support"><div data-shell="header"></div><main class="page"><section class="utility-head"><div><p class="eyebrow">Support</p><h1 class="page-title">Find your ECHO.</h1></div><div class="search-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg><input id="q" class="search-input" autocomplete="off" placeholder="Search model" aria-label="Find model"></div></section><section id="list" class="utility-list"></section><div data-shell="footer"></div></main><script src="assets/js/shell.js"></script><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let models=[],images={};function exact(u){return u&&!/manualslib\.com\/brand\/echo\/?$|benzo-spb\.ru\/?$/i.test(u)}function media(img,model){return img?`<img src="${esc(img)}" alt="ECHO ${esc(model)}" loading="lazy" referrerpolicy="no-referrer" onerror="this.parentElement.innerHTML='<span style=&quot;color:#8a8f94;font-size:11px&quot;>Image coming soon</span>'">`:`<span style="color:#8a8f94;font-size:11px">Image coming soon</span>`}function render(){const term=q.value.trim().toLowerCase();const rows=models.filter(m=>(m.model+' '+m.category).toLowerCase().includes(term));list.innerHTML=rows.map(m=>{const hasManual=exact(m.techdocs)||exact(m.manual);return`<a class="utility-card" href="model.html?model=${encodeURIComponent(m.model)}#resources"><div class="utility-thumb">${media(images[m.model],m.model)}</div><div class="utility-copy"><div class="utility-model">${esc(m.model)}</div><div class="utility-class">${esc(m.category)}</div><div class="utility-actions"><span class="utility-action">${hasManual?'Manuals':'Ask for manual'}</span><span class="utility-action">Maintenance</span><span class="utility-action">Parts</span></div></div></a>`}).join('')||'<div class="empty-state">No matching model.</div>'}Promise.all([fetch('data/models.json').then(r=>r.json()),fetch('data/images.json').then(r=>r.json())]).then(([m,i])=>{models=m;images=i;render()});q.addEventListener('input',render);</script></body></html>
