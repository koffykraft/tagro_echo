<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff"><title>ECHO Parts · TAGRO Kerala</title><link rel="stylesheet" href="assets/css/site.css"><link rel="stylesheet" href="assets/css/desktop.css"><link rel="stylesheet" href="assets/css/mobile.css"><style>.utilityhead{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:8px 2px 20px}.utilityhead h1{font-size:clamp(34px,5vw,56px);margin:4px 0 0}.toolbar{max-width:520px;margin:0 0 18px}.resourcegrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.resource{background:#fff;border:1px solid var(--line);border-radius:20px;padding:18px;text-decoration:none;min-height:150px;display:flex;flex-direction:column}.resource .model{font-size:25px;font-weight:900}.resource .type{color:var(--muted);font-size:13px}.resource .go{margin-top:auto;padding-top:18px;font-weight:800}.sitefooter{margin-top:28px}@media(max-width:768px){.utilityhead{margin:5px 2px 14px}.utilityhead h1{font-size:31px}.toolbar{margin-bottom:12px}.resourcegrid{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;margin-right:-14px}.resource{flex:0 0 76vw;max-width:300px;scroll-snap-align:start;min-height:140px}}</style></head><body><header class="top"><div class="topin"><a class="brandlock" href="index.html"><img class="tagro" src="assets/brand/tagro-logo.png" alt="TAGRO"><span class="brandx">×</span><img class="echo" src="assets/brand/echo-logo-dark.svg" alt="ECHO"></a><nav class="nav"><a href="index.html">Equipment</a><a href="service.html">Support</a><a class="active" href="parts.html">Parts</a><a class="ai" href="assistant.html">Ask AI</a></nav></div></header><main class="wrap"><div class="utilityhead"><div><div class="eyebrow">Parts</div><h1>Find parts by machine</h1></div><p id="count"></p></div><div class="toolbar"><input id="q" class="search" autocomplete="off" placeholder="Find your model"></div><section id="grid" class="resourcegrid"></section><footer class="sitefooter"><div class="contacticons"><a class="contacticon" href="https://wa.me/918921773291" aria-label="WhatsApp TAGRO" title="WhatsApp"><svg viewBox="0 0 24 24"><path d="M20.5 11.7a8.5 8.5 0 0 1-12.6 7.4L3.5 20.5l1.4-4.2A8.5 8.5 0 1 1 20.5 11.7Z"></path><path d="M9 8.5c.3 2.8 2.1 4.7 5 5.4"></path></svg></a><a class="contacticon" href="mailto:info@tagro.in" aria-label="Email TAGRO" title="Email"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m4 7 8 6 8-6"></path></svg></a></div><div class="sitelinks"><a href="https://www.tagro.in/" target="_blank" rel="noopener">Visit TAGRO website</a><a href="https://www.echo-india.com/en_us/" target="_blank" rel="noopener">Visit ECHO India website</a></div></footer></main><script>const esc=s=>String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));let models=[];function render(){const t=q.value.trim().toLowerCase();const list=models.filter(m=>(m.model+' '+m.category).toLowerCase().includes(t));count.textContent=list.length+' models';grid.innerHTML=list.map(m=>`<a class="resource" href="${esc(m.parts)}" target="_blank" rel="noopener"><span class="pill">${esc(m.category)}</span><div class="model">${esc(m.model)}</div><div class="type">${esc(m.category)}</div><div class="go">Open parts information</div></a>`).join('')}fetch('data/models.json').then(r=>r.json()).then(x=>{models=x;render()});q.addEventListener('input',render);</script></body></html>
