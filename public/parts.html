<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>ECHO Parts · TAGRO Kerala</title><meta name="description" content="Find ECHO parts information by machine model."><link rel="stylesheet" href="assets/css/site.css"><link rel="stylesheet" href="assets/css/desktop.css"><link rel="stylesheet" href="assets/css/mobile.css"></head><body data-page="parts"><div data-shell="header"></div><main class="page"><section class="utility-head"><div><p class="eyebrow">Parts</p><h1 class="page-title">Start with the machine.</h1><p class="lede">Select the exact model. Parts resources stay inside the TAGRO model view until you choose to open an external source.</p></div><div class="search-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg><input id="q" class="search-input" autocomplete="off" placeholder="Find model" aria-label="Find model"></div></section><section id="list" class="utility-list"></section><div data-shell="footer"></div></main><script src="assets/js/shell.js"></script><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let models=[],images={};function render(){const term=q.value.trim().toLowerCase();const rows=models.filter(m=>(m.model+' '+m.category).toLowerCase().includes(term));list.innerHTML=rows.map(m=>`<a class="utility-row" href="model.html?model=${encodeURIComponent(m.model)}#resources"><div class="utility-thumb">${images[m.model]?`<img src="${esc(images[m.model])}" alt="ECHO ${esc(m.model)}" loading="lazy" referrerpolicy="no-referrer">`:''}</div><div><strong>${esc(m.model)}</strong><small>${esc(m.category)}</small></div><span class="row-action">View parts</span></a>`).join('')||'<div class="empty-state">No matching model.</div>'}Promise.all([fetch('data/models.json').then(r=>r.json()),fetch('data/images.json').then(r=>r.json())]).then(([m,i])=>{models=m;images=i;render()});q.addEventListener('input',render);</script></body></html>
