<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>ECHO Parts · TAGRO Kerala</title><meta name="description" content="Find ECHO parts resources by machine model."><link rel="stylesheet" href="assets/css/site.css"><link rel="stylesheet" href="assets/css/desktop.css"><link rel="stylesheet" href="assets/css/mobile.css"></head><body data-page="parts"><div data-shell="header"></div><main class="page"><section class="utility-head"><div><p class="eyebrow">Parts</p><h1 class="page-title">Which ECHO do you have?</h1></div><div class="search-wrap"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"></circle><path d="m16 16 4 4"></path></svg><input id="q" class="search-input" autocomplete="off" placeholder="Search model" aria-label="Find model"></div></section><section id="list" class="utility-list"></section><div data-shell="footer"></div></main><script src="assets/js/shell.js"></script><script>const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));let models=[],images={};function exact(u){return u&&!/benzo-spb\.ru\/?$/i.test(u)}function render(){const term=q.value.trim().toLowerCase();const rows=models.filter(m=>(m.model+' '+m.category).toLowerCase().includes(term));list.innerHTML=rows.map(m=>{const hasParts=exact(m.parts)||exact(m.techdocs);return`<a class="utility-card" href="model.html?model=${encodeURIComponent(m.model)}#resources"><div class="utility-thumb">${images[m.model]?`<img src="${esc(images[m.model])}" alt="ECHO ${esc(m.model)}" loading="lazy" referrerpolicy="no-referrer">`:''}</div><div class="utility-copy"><div class="utility-model">${esc(m.model)}</div><div class="utility-class">${esc(m.category)}</div><div class="utility-actions"><span class="utility-action">${hasParts?'Parts catalogue':'Ask TAGRO'}</span><span class="utility-action">Service parts</span><span class="utility-action">Manuals</span></div></div></a>`}).join('')||'<div class="empty-state">No matching model.</div>'}Promise.all([fetch('data/models.json').then(r=>r.json()),fetch('data/images.json').then(r=>r.json())]).then(([m,i])=>{models=m;images=i;render()});q.addEventListener('input',render);</script></body></html>
