<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#ffffff"><title>Ask TAGRO ECHO AI</title><meta name="description" content="Get help choosing, comparing or understanding ECHO outdoor power equipment."><link rel="stylesheet" href="assets/css/site.css"><link rel="stylesheet" href="assets/css/desktop.css"><link rel="stylesheet" href="assets/css/mobile.css"></head><body data-page="ai"><div data-shell="header"></div><main class="page chat-shell"><section class="chat-intro"><p class="eyebrow">TAGRO ECHO AI</p><h1 class="page-title">Tell me about the work.</h1><p class="lede">I’ll ask only what matters, then narrow the choice.</p></section><section class="choice-grid" aria-label="Start a conversation"><button class="choice-card" data-prompt="Help me choose the right ECHO machine for my work."><strong>Help me choose</strong><span>Start with the job</span></button><button class="choice-card" data-prompt="I want to compare an ECHO machine with what I use now."><strong>Compare</strong><span>Against your current machine</span></button><button class="choice-card" data-prompt="I want a price estimate for an ECHO machine."><strong>Estimate</strong><span>Build a short estimate</span></button><button class="choice-card" data-prompt="I need help with a manual, part or maintenance question."><strong>Support</strong><span>Manuals, parts or upkeep</span></button></section><div id="messages" class="messages"><div class="message ai">What are you trying to do?</div></div><div id="handoff" class="handoff"><a id="ownerWa" class="icon-action" target="_blank" rel="noopener" aria-label="Send to TAGRO by WhatsApp" title="WhatsApp"></a><a id="ownerMail" class="icon-action" aria-label="Email TAGRO" title="Email"></a></div><div class="composer"><textarea id="input" placeholder="Type here…" aria-label="Message TAGRO ECHO AI"></textarea><button id="send" class="send-button">Send</button></div><div data-shell="footer"></div></main><script src="assets/js/shell.js"></script><script>const history=[],box=document.getElementById('messages'),input=document.getElementById('input'),send=document.getElementById('send'),handoff=document.getElementById('handoff'),ownerWa=document.getElementById('ownerWa'),ownerMail=document.getElementById('ownerMail');ownerWa.innerHTML=TAGRO_UI.icons.whatsapp;ownerMail.innerHTML=TAGRO_UI.icons.mail;const qs=new URLSearchParams(location.search),selected=qs.get('model'),compare=qs.get('compare');function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function formatAI(t){return esc(t).replace(/^###?\s+(.+)$/gm,'<strong>$1</strong>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/^[-•]\s+(.+)$/gm,'• $1')}function add(t,c='ai'){const d=document.createElement('div');d.className='message '+c;if(c==='ai')d.innerHTML=formatAI(t);else d.textContent=t;box.appendChild(d);d.scrollIntoView({block:'end',behavior:'smooth'})}function setHandoff(text){const msg='TAGRO ECHO enquiry%0A%0A'+encodeURIComponent(text);ownerWa.href='https://wa.me/919656361846?text='+msg;ownerMail.href='mailto:info@tagro.in?subject='+encodeURIComponent('TAGRO ECHO enquiry')+'&body='+encodeURIComponent(text);handoff.classList.add('show')}async function go(forced){const m=(forced||input.value).trim();if(!m)return;input.value='';add(m,'me');send.disabled=true;handoff.classList.remove('show');try{const r=await fetch('/api/ai/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:m,history})});const j=await r.json();if(!r.ok)throw new Error(j.error||'AI unavailable');const ready=String(j.reply||'').includes('[[ESTIMATE_READY]]');const reply=String(j.reply||'').replace(/\[\[ESTIMATE_READY\]\]/g,'').trim();add(reply);history.push({role:'user',content:m},{role:'assistant',content:reply});if(history.length>12)history.splice(0,history.length-12);if(ready)setHandoff(reply)}catch(e){add('I could not connect just now. You can still use WhatsApp or email below.')}finally{send.disabled=false;input.focus()}}send.onclick=()=>go();input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();go()}});document.querySelector('.choice-grid').addEventListener('click',e=>{const b=e.target.closest('.choice-card');if(b)go(b.dataset.prompt)});if(selected){messages.innerHTML=`<div class="message ai">You’re looking at ${esc(selected)}. What work do you want it to do?</div>`}else if(compare){messages.innerHTML=`<div class="message ai">You’re considering ${esc(compare)}. What machine are you using now?</div>`}</script></body></html>
