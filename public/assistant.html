:82px}}</style></head><body><header class="top"><div class="topin"><a class="brandlock" href="index.html"><img class="tagro" src="assets/brand/tagro-logo.png" alt="TAGRO"><span class="brandx">×</span><img class="echo" src="assets/brand/echo-logo-dark.svg" alt="ECHO"></a><nav class="nav"><a href="index.html">Equipment</a><a href="service.html">Support</a><a href="parts.html">Parts</a><a class="ai" href="assistant.html">Ask AI</a></nav></div></header><main class="wrap chat"><div class="chathead"><div class="kicker">TAGRO ECHO AI</div><h1>What do you need to get done?</h1></div><div class="quickactions"><button data-prompt="Help me choose the right ECHO machine.">Choose a machine</button><button data-prompt="Compare an ECHO model with my existing machine.">Compare</button><button data-prompt="Create an estimate for me.">Create estimate</button><button data-prompt="I need help with parts or maintenance.">Parts / support</button></div><div id="msgs" class="msgs"><div class="msg">Tell me what work you have in mind. I’ll ask only what matters and help narrow it down.</div></div><div id="handoff" class="handoff"><a id="ownerWa" target="_blank" rel="noopener">Send to TAGRO</a><a id="ownerMail" class="secondary">Email estimate</a></div><div class="composer"><textarea id="input" placeholder="Type here…"></textarea><button id="send" class="btn">Send</button></div><footer class="utilityfooter"><a href="https://wa.me/918921773291" target="_blank" rel="noopener">WhatsApp +91 8921 773291</a><a href="https://www.tagro.in/" target="_blank" rel="noopener">tagro.in</a><a href="https://www.echo-india.com/en_us/" target="_blank" rel="noopener">ECHO India</a></footer></main><script>const history=[];const box=document.getElementById('msgs'),input=document.getElementById('input'),send=document.getElementById('send'),handoff=document.getElementById('handoff'),ownerWa=document.getElementById('ownerWa'),ownerMail=document.getElementById('ownerMail');let lastEstimate='';function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function formatAI(t){let s=esc(t);s=s.replace(/^###?\s+(.+)$/gm,'<b>$1</b>').replace(/^[-•]\s+(.+)$/gm,'• $1').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');return s}function add(t,c=''){const d=document.createElement('div');d.className='msg '+c;if(c==='ai')d.innerHTML=formatAI(t);else d.textContent=t;box.appendChild(d);box.scrollTop=box.scrollHeight}function setHandoff(text){lastEstimate=text;const msg='TAGRO ECHO estimate / customer enquiry%0A%0A'+encodeURIComponent(text);ownerWa.href='https://wa.me/919656361846?text='+msg;ownerMail.href='mailto:info@tagro.in?subject='+encodeURIComponent('TAGRO ECHO Estimate')+'&body='+encodeURIComponent(text);handoff.classList.add('show')}async function go(forced){const m=(forced||input.value).trim();if(!m)return;input.value='';add(m,'me');send.disabled=true;handoff.classList.remove('show');try{const r=await fetch('/api/ai/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:m,history})});const j=await r.json();if(!r.ok)throw new Error(j.error||'AI unavailable');const ready=String(j.reply||'').includes('[[ESTIMATE_READY]]');const reply=String(j.reply||'').replace(/\[\[ESTIMATE_READY\]\]/g,'').trim();add(reply,'ai');history.push({role:'user',content:m},{role:'assistant',content:reply});if(history.length>12)history.splice(0,history.length-12);if(ready)setHandoff(reply)}catch(e){add('AI connection: '+e.message)}finally{send.disabled=false;input.focus()}}send.onclick=()=>go();input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();go()}});document.querySelector('.quickactions').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.prompt)};</script></body></html>
