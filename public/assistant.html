<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff"><title>Ask TAGRO ECHO AI</title><link rel="stylesheet" href="assets/css/site.css"><link rel="stylesheet" href="assets/css/desktop.css"><link rel="stylesheet" href="assets/css/mobile.css"><style>.chat{max-width:900px;margin:auto}.chathead{margin:6px 0 12px}.chathead h1{font-size:clamp(36px,5vw,56px);margin:.1em 0}.msgs{min-height:320px;background:#fff;border:1px solid var(--line);border-radius:22px;padding:14px;margin:12px 0}.msg{padding:12px 14px;margin:8px 0;border-radius:14px;background:#f3f3ef;white-space:pre-wrap}.msg.me{background:#fff0e5}.msg.ai{line-height:1.55}.composer{display:flex;gap:8px;position:sticky;bottom:12px;background:rgba(246,246,243,.94);backdrop-filter:blur(14px);padding:8px 0}.composer textarea{flex:1;min-height:60px;max-height:150px;padding:13px;border:1px solid #ccc;border-radius:16px;font:inherit;resize:vertical}.quickactions{display:flex;gap:8px;overflow:auto;scrollbar-width:none;margin:8px 0 2px}.quickactions button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:9px 13px;font-weight:750}.handoff{display:none;gap:8px;margin:10px 0}.handoff.show{display:flex}.handoff a{width:42px;height:42px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;background:#fff}.handoff svg{width:20px;height:20px;fill:none;stroke:#111;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.sitefooter{margin-top:20px}@media(max-width:768px){.chathead{margin:0}.chathead h1{font-size:31px}.msgs{min-height:44vh;border-radius:18px;padding:10px}.composer{bottom:76px}.composer textarea{min-height:54px}}</style></head><body><header class="top"><div class="topin"><a class="brandlock" href="index.html"><img class="tagro" src="assets/brand/tagro-logo.png" alt="TAGRO"><span class="brandx">×</span><img class="echo" src="assets/brand/echo-logo-dark.svg" alt="ECHO"></a><nav class="nav"><a href="index.html">Equipment</a><a href="service.html">Support</a><a href="parts.html">Parts</a><a class="ai active" href="assistant.html">Ask AI</a></nav></div></header><main class="wrap chat"><div class="chathead"><div class="kicker">TAGRO ECHO AI</div><h1>How can I help?</h1></div><div class="quickactions"><button data-prompt="Help me choose the right ECHO machine.">Choose</button><button data-prompt="Compare an ECHO model with my existing machine.">Compare</button><button data-prompt="Create an estimate for me.">Estimate</button><button data-prompt="I need help with parts or maintenance.">Support</button></div><div id="msgs" class="msgs"><div class="msg">Tell me what you want to do.</div></div><div id="handoff" class="handoff"><a id="ownerWa" target="_blank" rel="noopener" aria-label="Send estimate to TAGRO by WhatsApp" title="WhatsApp TAGRO"><svg viewBox="0 0 24 24"><path d="M20.5 11.7a8.5 8.5 0 0 1-12.6 7.4L3.5 20.5l1.4-4.2A8.5 8.5 0 1 1 20.5 11.7Z"></path><path d="M9 8.5c.3 2.8 2.1 4.7 5 5.4"></path></svg></a><a id="ownerMail" aria-label="Email estimate to TAGRO" title="Email TAGRO"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m4 7 8 6 8-6"></path></svg></a></div><div class="composer"><textarea id="input" placeholder="Type here…"></textarea><button id="send" class="btn">Send</button></div><footer class="sitefooter"><div class="contacticons"><a class="contacticon" href="https://wa.me/918921773291" aria-label="WhatsApp TAGRO" title="WhatsApp"><svg viewBox="0 0 24 24"><path d="M20.5 11.7a8.5 8.5 0 0 1-12.6 7.4L3.5 20.5l1.4-4.2A8.5 8.5 0 1 1 20.5 11.7Z"></path><path d="M9 8.5c.3 2.8 2.1 4.7 5 5.4"></path></svg></a><a class="contacticon" href="mailto:info@tagro.in" aria-label="Email TAGRO" title="Email"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m4 7 8 6 8-6"></path></svg></a></div><div class="sitelinks"><a href="https://www.tagro.in/" target="_blank" rel="noopener">Visit TAGRO website</a><a href="https://www.echo-india.com/en_us/" target="_blank" rel="noopener">Visit ECHO India website</a></div></footer></main><script>const history=[];const box=document.getElementById('msgs'),input=document.getElementById('input'),send=document.getElementById('send'),handoff=document.getElementById('handoff'),ownerWa=document.getElementById('ownerWa'),ownerMail=document.getElementById('ownerMail');function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function formatAI(t){let s=esc(t);s=s.replace(/^###?\s+(.+)$/gm,'<b>$1</b>').replace(/^[-•]\s+(.+)$/gm,'• $1').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');return s}function add(t,c=''){const d=document.createElement('div');d.className='msg '+c;if(c==='ai')d.innerHTML=formatAI(t);else d.textContent=t;box.appendChild(d);box.scrollTop=box.scrollHeight}function setHandoff(text){const msg='TAGRO ECHO estimate / customer enquiry%0A%0A'+encodeURIComponent(text);ownerWa.href='https://wa.me/919656361846?text='+msg;ownerMail.href='mailto:info@tagro.in?subject='+encodeURIComponent('TAGRO ECHO Estimate')+'&body='+encodeURIComponent(text);handoff.classList.add('show')}async function go(forced){const m=(forced||input.value).trim();if(!m)return;input.value='';add(m,'me');send.disabled=true;handoff.classList.remove('show');try{const r=await fetch('/api/ai/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:m,history})});const j=await r.json();if(!r.ok)throw new Error(j.error||'AI unavailable');const ready=String(j.reply||'').includes('[[ESTIMATE_READY]]');const reply=String(j.reply||'').replace(/\[\[ESTIMATE_READY\]\]/g,'').trim();add(reply,'ai');history.push({role:'user',content:m},{role:'assistant',content:reply});if(history.length>12)history.splice(0,history.length-12);if(ready)setHandoff(reply)}catch(e){add('AI connection: '+e.message)}finally{send.disabled=false;input.focus()}}send.onclick=()=>go();input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();go()}});document.querySelector('.quickactions').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.prompt)};</script></body></html>
