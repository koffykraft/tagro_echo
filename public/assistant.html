yId('send'),handoff=document.getElementById('handoff'),ownerWa=document.getElementById('ownerWa'),ownerMail=document.getElementById('ownerMail');ownerWa.innerHTML=TAGRO_UI.icons.whatsapp;ownerMail.innerHTML=TAGRO_UI.icons.mail;const qs=new URLSearchParams(location.search),selected=qs.get('model'),compare=qs.get('compare');function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function formatAI(t){return esc(t).replace(/^###?\s+(.+)$/gm,'<strong>$1</strong>').replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>').replace(/^[-•]\s+(.+)$/gm,'• $1')}function add(t,c='ai'){const d=document.createElement('div');d.className='message '+c;if(c==='ai')d.innerHTML=formatAI(t);else d.textContent=t;box.appendChild(d);d.scrollIntoView({block:'nearest',behavior:'smooth'})}function setHandoff(text){const msg='TAGRO ECHO enquiry%0A%0A'+encodeURIComponent(text);ownerWa.href='https://wa.me/919656361846?text='+msg;ownerMail.href='mailto:info@tagro.in?subject='+encodeURIComponent('TAGRO ECHO enquiry')+'&body='+encodeURIComponent(text);handoff.classList.add('show')}async function go(forced){const m=(forced||input.value).trim();if(!m)return;input.value='';add(m,'me');send.disabled=true;handoff.classList.remove('show');try{const r=await fetch('/api/ai/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:m,history})});const j=await r.json();if(!r.ok)throw new Error(j.error||'AI unavailable');const ready=String(j.reply||'').includes('[[ESTIMATE_READY]]');const reply=String(j.reply||'').replace(/\[\[ESTIMATE_READY\]\]/g,'').trim();add(reply);history.push({role:'user',content:m},{role:'assistant',content:reply});if(history.length>12)history.splice(0,history.length-12);if(ready)setHandoff(reply)}catch(e){add('I could not connect just now. You can still use WhatsApp or email below.')}finally{send.disabled=false;input.focus()}}send.onclick=()=>go();input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();go()}});document.querySelector('.ai-starters').addEventListener('click',e=>{const b=e.target.closest('.starter');if(b)go(b.dataset.prompt)});if(selected){add(`You’re looking at ${esc(selected)}. What are you planning to use it for?`)}else if(compare){add(`You’re considering ${esc(compare)}. What machine are you using now?`)}</script></body></html>
