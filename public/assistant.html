<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#fff"><title>Ask TAGRO ECHO AI</title><link rel="stylesheet" href="assets/css/site.css"><link rel="stylesheet" href="assets/css/desktop.css"><link rel="stylesheet" href="assets/css/mobile.css"><style>.chat{max-width:900px;margin:auto}.chathead{margin:2px 0 9px}.chathead h1{font-size:clamp(34px,5vw,48px);margin:.08em 0}.msgs{min-height:300px;background:#fff;border:1px solid var(--line);border-radius:19px;padding:12px;margin:10px 0}.msg{padding:11px 13px;margin:7px 0;border-radius:13px;background:#f3f3ef;white-space:pre-wrap}.msg.me{background:#fff0e5}.msg.ai{line-height:1.5}.composer{display:flex;gap:7px;position:sticky;bottom:10px;background:rgba(247,247,244,.94);backdrop-filter:blur(14px);padding:7px 0}.composer textarea{flex:1;min-height:56px;max-height:140px;padding:12px;border:1px solid #ccc;border-radius:14px;font:inherit;resize:vertical}.quickactions{display:flex;gap:7px;overflow:auto;scrollbar-width:none;margin:7px 0 1px}.quickactions button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 11px;font-weight:750}.handoff{display:none;gap:7px;margin:8px 0}.handoff.show{display:flex}.handoff a{width:39px;height:39px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;background:#fff}.handoff svg{width:18px;height:18px;fill:none;stroke:#111;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.sitefooter{margin-top:16px}@media(max-width:768px){.chathead{margin:0}.chathead h1{font-size:29px}.msgs{min-height:42vh;border-radius:16px;padding:9px}.composer{bottom:66px}.composer textarea{min-height:50px}.quickactions button{font-size:11px}}</style></head><body><header class="top"><div class="topin"><a class="brandlock" href="index.html"><img class="tagro" src="assets/brand/tagro-logo-actual.webp" alt="TAGRO"><span class="brandx">×</span><img class="echo" src="assets/brand/echo-logo-dark.svg" alt="ECHO"></a><nav class="nav"><a href="index.html"><svg class="navicon" viewBox="0 0 24 24"><path d="M4 10.5 12 4l8 6.5V20H4Z"/><path d="M9 20v-6h6v6"/></svg><span>Equipment</span></a><a href="service.html"><svg class="navicon" viewBox="0 0 24 24"><path d="M4 5.5A3.5 3.5 0 0 1 7.5 2H20v17H7.5A3.5 3.5 0 0 0 4 22Z"/><path d="M4 5.5V22"/></svg><span>Support</span></a><a href="parts.html"><svg class="navicon" viewBox="0 0 24 24"><path d="m12 3 8 4.5v9L12 21l-8-4.5v-9Z"/><path d="m4 7.5 8 4.5 8-4.5M12 12v9"/></svg><span>Parts</span></a><a class="ai active" href="assistant.html"><svg class="navicon" viewBox="0 0 24 24"><path d="m12 2 1.8 5.2L19 9l-5.2 1.8L12 16l-1.8-5.2L5 9l5.2-1.8Z"/><path d="m19 15 .9 2.1L22 18l-2.1.9L19 21l-.9-2.1L16 18l2.1-.9Z"/></svg><span>Ask AI</span></a></nav></div></header><main class="wrap chat"><div class="chathead"><div class="kicker">TAGRO ECHO AI</div><h1>How can I help?</h1></div><div class="quickactions"><button data-prompt="Help me choose the right ECHO machine.">Choose</button><button data-prompt="Compare an ECHO model with my existing machine.">Compare</button><button data-prompt="Create an estimate for me.">Estimate</button><button data-prompt="I need help with parts or maintenance.">Support</button></div><div id="msgs" class="msgs"><div class="msg">Tell me what you want to do.</div></div><div id="handoff" class="handoff"><a id="ownerWa" target="_blank" rel="noopener" aria-label="Send to TAGRO by WhatsApp" title="WhatsApp"><svg viewBox="0 0 24 24"><path d="M20.5 11.7a8.5 8.5 0 0 1-12.6 7.4L3.5 20.5l1.4-4.2A8.5 8.5 0 1 1 20.5 11.7Z"></path><path d="M9 8.5c.3 2.8 2.1 4.7 5 5.4"></path></svg></a><a id="ownerMail" aria-label="Email to TAGRO" title="Email"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m4 7 8 6 8-6"></path></svg></a></div><div class="composer"><textarea id="input" placeholder="Type here…"></textarea><button id="send" class="btn">Send</button></div><footer class="sitefooter"><div class="contacticons"><a class="contacticon" href="https://wa.me/918921773291" aria-label="WhatsApp TAGRO" title="WhatsApp"><svg viewBox="0 0 24 24"><path d="M20.5 11.7a8.5 8.5 0 0 1-12.6 7.4L3.5 20.5l1.4-4.2A8.5 8.5 0 1 1 20.5 11.7Z"></path><path d="M9 8.5c.3 2.8 2.1 4.7 5 5.4"></path></svg></a><a class="contacticon" href="mailto:info@tagro.in" aria-label="Email TAGRO" title="Email"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path d="m4 7 8 6 8-6"></path></svg></a></div><div class="sitelinks"><a href="https://www.tagro.in/" target="_blank" rel="noopener">Visit TAGRO website</a><a href="https://www.echo-india.com/en_us/" target="_blank" rel="noopener">Visit ECHO India website</a></div></footer></main><script>const history=[];const box=document.getElementById('msgs'),input=document.getElementById('input'),send=document.getElementById('send'),handoff=document.getElementById('handoff'),ownerWa=document.getElementById('ownerWa'),ownerMail=document.getElementById('ownerMail');const selected=new URLSearchParams(location.search).get('model');function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function formatAI(t){let s=esc(t);s=s.replace(/^###?\s+(.+)$/gm,'<b>$1</b>').replace(/^[-•]\s+(.+)$/gm,'• $1').replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');return s}function add(t,c=''){const d=document.createElement('div');d.className='msg '+c;if(c==='ai')d.innerHTML=formatAI(t);else d.textContent=t;box.appendChild(d);box.scrollTop=box.scrollHeight}function setHandoff(text){const msg='TAGRO ECHO estimate / customer enquiry%0A%0A'+encodeURIComponent(text);ownerWa.href='https://wa.me/919656361846?text='+msg;ownerMail.href='mailto:info@tagro.in?subject='+encodeURIComponent('TAGRO ECHO Estimate')+'&body='+encodeURIComponent(text);handoff.classList.add('show')}async function go(forced){const m=(forced||input.value).trim();if(!m)return;input.value='';add(m,'me');send.disabled=true;handoff.classList.remove('show');try{const r=await fetch('/api/ai/chat',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({message:m,history})});const j=await r.json();if(!r.ok)throw new Error(j.error||'AI unavailable');const ready=String(j.reply||'').includes('[[ESTIMATE_READY]]');const reply=String(j.reply||'').replace(/\[\[ESTIMATE_READY\]\]/g,'').trim();add(reply,'ai');history.push({role:'user',content:m},{role:'assistant',content:reply});if(history.length>12)history.splice(0,history.length-12);if(ready)setHandoff(reply)}catch(e){add('AI connection: '+e.message)}finally{send.disabled=false;input.focus()}}send.onclick=()=>go();input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();go()}});document.querySelector('.quickactions').onclick=e=>{const b=e.target.closest('button');if(b)go(b.dataset.prompt)};if(selected){input.value='I am looking at '+selected+'. Help me decide if it suits my work.'}</script></body></html>
